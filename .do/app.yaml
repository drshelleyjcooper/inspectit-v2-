name: inspectit
region: nyc

# Both hostnames are served by the api service below. The apex is primary;
# rel="canonical" and og:url in index.html also point there, so search
# engines consolidate on it regardless of which host a visitor arrives on.
# DigitalOcean manages the DNS zone (ns1-3.digitalocean.com), so adding the
# domain on the app creates the record and provisions the TLS certificate.
domains:
  - domain: inspectit.app
    type: PRIMARY
  - domain: www.inspectit.app
    type: ALIAS
services:
  - name: api
    github:
      repo: drshelleyjcooper/inspectit-v2-
      branch: main
      deploy_on_push: true
    environment_slug: python
    build_command: pip install -r requirements.txt
    run_command: uvicorn api.main:app --host 0.0.0.0 --port $PORT --workers 2 --no-access-log
    instance_size_slug: basic-xxs
    instance_count: 1
    http_port: 8080
    # The API serves the landing page (/) and the app (/web/...) itself
    # (see api/main.py), so it owns the whole domain. Do NOT add a separate
    # static-site component on "/" — App Platform would route "/auth/*",
    # "/me", etc. to the static site and the app would get HTML 404s
    # instead of JSON ("Request failed (404)" on the login screen).
    routes:
      - path: /
    health_check:
      http_path: /health
    envs:
      - key: APP_ENV
        value: production
      - key: JWT_SECRET
        type: SECRET
      - key: DATABASE_URL
        value: ${inspectit-db.DATABASE_URL}
      - key: ALLOWED_ORIGINS
        value: https://inspectit.app,https://www.inspectit.app
      - key: POOL_MAX
        value: "5"
      # First platform admin(s) for /web/admin.html — must already have an
      # account. Comma-separated.
      - key: PLATFORM_ADMIN_EMAILS
        value: "you@inspectit.app"
      - key: STORAGE_BACKEND
        value: s3
      - key: SPACES_REGION
        value: nyc3
      - key: SPACES_BUCKET
        value: inspectit-files
      - key: SPACES_KEY
        type: SECRET
      - key: SPACES_SECRET
        type: SECRET
databases:
  - name: inspectit-db
    engine: PG
    production: true
