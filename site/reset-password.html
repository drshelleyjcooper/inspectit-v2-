<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choose a new password | Inspectit.app</title>
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0f2347">
<link rel="icon" href="/assets/logo-mark.png" type="image/png">
<link rel="preload" href="/assets/fonts/newsreader-1.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/inter-0.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/css/fonts.css">
<link rel="stylesheet" href="/css/styles.css">
</head>
<body class="account-page">
<a class="skip-link" href="#main">Skip to main content</a>
<header class="site-header">
  <div class="site-header__inner">
    <a class="brand" href="/" aria-label="Inspectit.app home"><img src="/assets/logo.png" alt="Inspectit.app. Smarter inspections. Safer living." width="1200" height="1057"></a>
    <a class="btn btn--ghost" href="https://inspectit.app/web/inspectit-app.html">Log in</a>
  </div>
</header>
<main id="main" tabindex="-1" class="account">
  <div class="account__card">
    <h1 id="page-title">Choose a new password</h1>
    <div id="reset-wrap">
      <p>Pick a password with at least 8 characters.</p>
      <form id="reset-form" novalidate>
        <div class="field">
          <label for="rp-pass">New password <span class="req">(required)</span></label>
          <input id="rp-pass" name="password" type="password" autocomplete="new-password" minlength="8" required aria-describedby="rp-hint">
          <span class="hint" id="rp-hint">Use at least 8 characters.</span>
        </div>
        <div class="field">
          <label for="rp-pass2">Confirm new password <span class="req">(required)</span></label>
          <input id="rp-pass2" name="password2" type="password" autocomplete="new-password" required>
          <label class="check"><input type="checkbox" id="rp-show"> Show passwords</label>
        </div>
        <button type="submit" class="btn btn--solid btn--lg">Change password</button>
      </form>
    </div>
    <p id="account-status" class="demo__status" role="status" aria-live="polite" tabindex="-1"></p>
    <p id="account-next" class="account__note" hidden></p>
  </div>
</main>
<footer class="site-footer">
  <div class="wrap site-footer__inner">
    <img src="/assets/logo-white.png" alt="Inspectit.app" width="1200" height="1057" class="site-footer__logo">
    <p>&copy; <span id="year">2026</span> Inspectit.app. Smarter inspections. Safer living.</p>
    <a href="/">Back to the home page</a>
  </div>
</footer>
<script src="/js/account.js"></script>
</body>
</html>
