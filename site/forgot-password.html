<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset your password | Inspectit.app</title>
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0f2347">
<link rel="icon" href="/assets/logo-mark.png" type="image/png">
<link rel="preload" href="/assets/fonts/newsreader-1.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/inter-0.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/css/fonts.css">
<link rel="stylesheet" href="/css/styles.css">
</head>
<body class="account-page">
<a class="skip-link" href="#main">Skip to main content</a>
<header class="site-header">
  <div class="site-header__inner">
    <a class="brand" href="/" aria-label="Inspectit.app home"><img src="/assets/logo.png" alt="Inspectit.app. Smarter inspections. Safer living." width="1200" height="1057"></a>
    <a class="btn btn--ghost" href="https://inspectit.app/web/inspectit-app.html">Log in</a>
  </div>
</header>
<main id="main" tabindex="-1" class="account">
  <div class="account__card">
    <h1 id="page-title">Reset your password</h1>
    <p>Enter the email you use for Inspectit.app. If we find an account, we will send you a link to choose a new password.</p>
    <form id="forgot-form" novalidate>
      <div class="field">
        <label for="fp-email">Email address <span class="req">(required)</span></label>
        <input id="fp-email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
        <span class="hint">Example: you@example.com</span>
      </div>
      <button type="submit" class="btn btn--solid btn--lg">Send reset link</button>
    </form>
    <p id="account-status" class="demo__status" role="status" aria-live="polite" tabindex="-1"></p>
    <p class="account__note"><a href="https://inspectit.app/web/inspectit-app.html">Back to log in</a></p>
  </div>
</main>
<footer class="site-footer">
  <div class="wrap site-footer__inner">
    <img src="/assets/logo-white.png" alt="Inspectit.app" width="1200" height="1057" class="site-footer__logo">
    <p>&copy; <span id="year">2026</span> Inspectit.app. Smarter inspections. Safer living.</p>
    <a href="/">Back to the home page</a>
  </div>
</footer>
<script src="/js/account.js"></script>
</body>
</html>
